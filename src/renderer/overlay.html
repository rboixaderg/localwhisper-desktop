<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: no-drag;
        user-select: none;
      }

      #indicator {
        display: none;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(24, 24, 28, 0.86);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      }

      #indicator.recording,
      #indicator.processing,
      #indicator.transcribing,
      #indicator.pasting {
        display: flex;
      }

      #indicator svg {
        width: 80px;
        height: 80px;
      }

      .mic-icon {
        fill: #e53e3e;
        color: #e53e3e;
        animation: micPulse 0.7s ease-in-out infinite;
        filter: drop-shadow(0 0 14px rgba(229, 62, 62, 0.7));
      }

      @keyframes micPulse {
        0%, 100% { transform: scale(0.88); opacity: 0.7; }
        50% { transform: scale(1.14); opacity: 1; }
      }

      .spinner-icon {
        animation: spin 1.2s linear infinite;
        filter: drop-shadow(0 0 10px rgba(240, 180, 40, 0.6));
      }

      .spinner-icon circle {
        fill: none;
        stroke: rgba(240, 180, 40, 0.92);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 38;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="indicator"></div>
    <script src="../shared/overlay.js"></script>
  </body>
</html>
